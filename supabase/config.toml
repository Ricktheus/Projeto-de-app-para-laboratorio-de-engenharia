# Supabase local configuration for the concrete-testing MVP.
# Used by `supabase start`, `supabase db reset`, `supabase gen types`,
# and `supabase test db`.
project_id = "concreto-mvp"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match Supabase's managed Postgres major version.
major_version = 15

[db.migrations]
# Apply files in supabase/migrations in lexicographic order.
enabled = true

[db.seed]
# Seeds are shipped as migration 0006_seed.sql (idempotent), so no separate
# seed file is needed here.
enabled = true
sql_paths = []

[auth]
enabled = true
# SECURITY (C1): public self-signup is DISABLED. Registration is internal only
# (PRD §2.5): accounts are created via the `admin-provisionar-usuario` Edge
# Function (Admin API + service_role), which sets the role in app_metadata. This
# is the load-bearing control that prevents anon self-provisioning as an admin;
# the handle_new_user trigger (migration 0018) additionally ignores user_metadata
# for role/is_admin. Do NOT re-enable signup without keeping both in place.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[studio]
enabled = true
port = 54323

# ----- Edge Functions (S004) -----
# Both require a valid JWT; the internal-role / admin guards run inside each
# function. Secrets (OPENAI_API_KEY, SUPABASE_SERVICE_ROLE_KEY) live only in the
# function environment (SPEC §7.1). The import map maps `@concreto/shared`,
# `zod` and `@supabase/supabase-js` for Deno (SPEC §6.2).
[functions.ocr-nota-fiscal]
verify_jwt = true
import_map = "./functions/_shared/deno.json"

[functions.admin-provisionar-usuario]
verify_jwt = true
import_map = "./functions/_shared/deno.json"

# S008 — report PDF generation and signed-PDF upload. Engineers only (the eng
# guard runs inside each function). LAUDO_VERIFICATION_SECRET / PUBLIC_SITE_URL
# live only in the function environment (SPEC §7.1).
[functions.gerar-laudo-pdf]
verify_jwt = true
import_map = "./functions/_shared/deno.json"

[functions.upload-laudo-assinado]
verify_jwt = true
import_map = "./functions/_shared/deno.json"

# S009 — public validation, Excel export and the transactional e-mail worker.
# `validar-laudo` is the ONLY anonymous surface (verify_jwt = false); it is
# read-only and rate-limited per IP inside the function (SPEC §5.5 / §7.1).
[functions.validar-laudo]
verify_jwt = false
import_map = "./functions/_shared/deno.json"

# Engineers only — the RBAC guard runs inside the function.
[functions.exportar-excel]
verify_jwt = true
import_map = "./functions/_shared/deno.json"

# Internal worker — authorizes via EMAIL_CRON_SECRET or an admin JWT inside the
# function (RESEND_API_KEY / EMAIL_CRON_SECRET live only in the function env).
[functions.enviar-email]
verify_jwt = false
import_map = "./functions/_shared/deno.json"
