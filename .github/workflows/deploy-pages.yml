name: Deploy web (GitHub Pages)

# Publishes the web app (apps/web) to GitHub Pages on every push to main, or on
# demand. One-time setup: Settings → Pages → Source: "GitHub Actions".
# The app is served under /<repo>/, so Vite's base and the router basename
# follow VITE_BASE; 404.html = index.html gives SPA deep links (/validar/...).
# Public Supabase URL + anon key come from apps/web/.env (anon key only — RLS
# enforces authorization; SPEC §7.1).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm --filter @concreto/web build
      - name: SPA fallback for deep links
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
